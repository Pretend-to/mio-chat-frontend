name: Deploy to Mio Chat Backend
on:
  push:
    branches:
      - master
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 获取所有提交历史，以便获取最新提交信息
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install pnpm
        # 固定 pnpm 10.34.x：不固定会漂移到 v11+，其 removed onlyBuiltDependencies /
        # strictDepBuilds=true 会导致 ERR_PNPM_IGNORED_BUILDS。node 20 下也无法跑 pnpm 11。
        run: npm install -g pnpm@10.34.5
      - name: Install dependencies
        run: |
          pnpm install
          if [ $? -ne 0 ]; then
            echo "Dependencies installation failed"
            exit 1
          fi
      - name: Run tests
        run: pnpm test
      - name: Build the project
        run: |
          pnpm run build
          if [ $? -ne 0 ]; then
            echo "Build failed"
            exit 1
          fi
      - name: Clone Mio Chat Backend repository
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GH_SECRET }}@github.com/Pretend-to/mio-chat-backend.git
          if [ $? -ne 0 ]; then
            echo "Clone failed"
            exit 1
          fi
      - name: Copy dist files
        run: |
          if [ -d "./dist" ]; then
            rm -rf ./mio-chat-backend/dist/
            cp -r ./dist/ ./mio-chat-backend/dist/
            echo "Files copied successfully"
            ls -la ./mio-chat-backend/dist/
          else
            echo "Error: dist directory not found"
            exit 1
          fi
      - name: Get latest commit message
        id: get_commit_message
        run: |
          # 只取标题（%s）：多行 body 插进下面的 -m "..." 既脆弱又不必要。
          # 并用 $GITHUB_OUTPUT 代替已弃用的 set-output 写法（GitHub 很快禁用它）。
          LATEST_COMMIT_MESSAGE=$(git log -1 --pretty=%s)
          {
            echo "message<<COMMIT_MESSAGE_EOF"
            echo "$LATEST_COMMIT_MESSAGE"
            echo "COMMIT_MESSAGE_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Commit and push changes
        run: |
          cd mio-chat-backend
          git config --global user.name "GitHub Action"
          git config --global user.email "mio@krumio.com"
          git status
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
            exit 0
          else
            git add .
            COMMIT_MESSAGE="feat: update frontend：${{ steps.get_commit_message.outputs.message }}"
            git commit -m "$COMMIT_MESSAGE"
            git push https://x-access-token:${{ secrets.GH_SECRET }}@github.com/Pretend-to/mio-chat-backend.git HEAD:master
            echo "Changes pushed successfully"
          fi
